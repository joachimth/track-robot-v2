<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <!-- Background -->
  <rect width="480" height="220" fill="#1a1a2e" rx="14"/>

  <!-- Title -->
  <text x="240" y="34" text-anchor="middle" fill="#e0e0e0"
        font-family="system-ui,sans-serif" font-size="15" font-weight="bold">
    PS4 Pairing Mode
  </text>
  <text x="240" y="54" text-anchor="middle" fill="#aaaacc"
        font-family="system-ui,sans-serif" font-size="12">
    Hold both buttons simultaneously for ~3 seconds
  </text>

  <!-- PS button -->
  <circle cx="130" cy="125" r="42" fill="#252545" stroke="#7b7bff" stroke-width="2.5"/>
  <circle cx="130" cy="125" r="30" fill="#1e1e3f" stroke="#5555cc" stroke-width="1.5"/>
  <text x="130" y="121" text-anchor="middle" fill="#9999ff"
        font-family="system-ui,sans-serif" font-size="15" font-weight="bold">PS</text>
  <text x="130" y="139" text-anchor="middle" fill="#7777cc"
        font-family="system-ui,sans-serif" font-size="11">button</text>

  <!-- Plus sign -->
  <text x="240" y="135" text-anchor="middle" fill="#ffffff"
        font-family="system-ui,sans-serif" font-size="36" font-weight="300">+</text>

  <!-- SHARE / Create button -->
  <rect x="298" y="83" width="84" height="84" rx="10" fill="#252545" stroke="#7b7bff" stroke-width="2.5"/>
  <rect x="308" y="93" width="64" height="64" rx="6" fill="#1e1e3f" stroke="#5555cc" stroke-width="1.5"/>
  <text x="340" y="123" text-anchor="middle" fill="#9999ff"
        font-family="system-ui,sans-serif" font-size="13" font-weight="bold">SHARE</text>
  <text x="340" y="141" text-anchor="middle" fill="#7777cc"
        font-family="system-ui,sans-serif" font-size="11">button</text>

  <!-- Light bar hint at bottom -->
  <rect x="160" y="186" width="160" height="14" rx="7" fill="#000044" stroke="#4444aa" stroke-width="1"/>
  <rect x="162" y="188" width="156" height="10" rx="5">
    <animate attributeName="fill" values="#0000ff;#3366ff;#6699ff;#3366ff;#0000ff"
             dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="240" y="210" text-anchor="middle" fill="#8888aa"
        font-family="system-ui,sans-serif" font-size="10">Light bar flashes rapidly when pairing</text>
</svg>
